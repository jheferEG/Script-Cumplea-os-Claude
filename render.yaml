services:
  - type: cron
    name: cumpleanos-bitrix24
    runtime: node
    schedule: "0 16 * * *"
    buildCommand: npm install
    startCommand: node cumple.js
    envVars:
      - key: BITRIX_WEBHOOK_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
